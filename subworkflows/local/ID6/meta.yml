# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ASSEMBLY_PRE"
description: Remove gene-level records from a reference GTF annotation
keywords:
  - GTF
  - annotation
  - filtering
components:
  - local/stringtie/clean
input:
  - ch_input:
      type: object
      description: Reference GTF annotation
output:
  - data:
      type: file
      description: Cleaned reference GTF containing transcript-level records
  - versions:
      type: file
      description: Version of the GTF cleaning tool used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ASSEMBLY_TRANSCRIPT"
description: Assemble transcripts from BAM alignments with StringTie
keywords:
  - StringTie
  - transcript assembly
  - GTF
  - BAM
components:
  - stringtie/stringtie
input:
  - ch_input:
      type: object
      description: BAM alignments with experiment, condition, strandedness, and reference annotation metadata
output:
  - data:
      type: file
      description: Assembled transcript GTF files with experiment and condition metadata
  - versions:
      type: file
      description: Version of StringTie used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ASSEMBLY_MERGE"
description: Merge assembled transcript GTF files with a reference annotation using StringTie
keywords:
  - StringTie
  - merge
  - GTF
  - reference
components:
  - stringtie/merge
input:
  - ch_input:
      type: object
      description: Transcript GTF files and reference GTF annotation
output:
  - data:
      type: file
      description: Merged transcript GTF file
  - versions:
      type: file
      description: Version of StringTie used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
