# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "TRANSCRIPT_PRE"
description: Remove gene-level records from a reference GTF annotation
keywords:
  - GTF
  - annotation
  - filtering
components:
  - stringtie/clean
input:
  - ch_input:
      type: object
      description: Reference GTF annotation
output:
  - data:
      type: file
      description: Cleaned reference GTF containing transcript-level records
  - versions:
      type: file
      description: Version of the GTF cleaning tool used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
