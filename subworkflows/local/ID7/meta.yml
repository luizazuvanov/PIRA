# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "SPLICING_LENGTH"
description: Determine the most common read length from STAR alignment statistics
keywords:
  - read length
  - STAR
  - statistics
components:
  - local/rmats/length
input:
  - ch_input:
      type: object
      description: STAR alignment statistics files containing read length records
output:
  - data:
      type: integer
      description: Most common read length used for rMATS analysis
  - versions:
      type: file
      description: Version of the read-length extraction tool used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "SPLICING_PRE"
description: Prepare BAM groups and intermediate files for rMATS alternative splicing analysis
keywords:
  - rMATS
  - alternative splicing
  - preparation
  - BAM
components:
  - local/rmats/prep
input:
  - ch_input:
      type: object
      description: GTF annotation, BAM files, sequencing type, read length, strandedness, and condition metadata
output:
  - data:
      type: directory
      description: rMATS preparation intermediate files with condition metadata
  - versions:
      type: file
      description: Version of rMATS used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "SPLICING_POS"
description: Run the rMATS post phase for alternative splicing analysis
keywords:
  - rMATS
  - alternative splicing
  - post-processing
  - BAM
components:
  - local/rmats/post
input:
  - ch_input:
      type: object
      description: GTF annotation, two BAM groups, rMATS preparation intermediates, sequencing type, and read length metadata
output:
  - versions:
      type: file
      description: Version of rMATS used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
