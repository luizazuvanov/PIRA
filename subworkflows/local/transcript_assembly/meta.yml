# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "TRANSCRIPT_ASSEMBLY"
description: Assemble transcripts from BAM alignments with StringTie
keywords:
  - StringTie
  - transcript assembly
  - GTF
  - BAM
components:
  - stringtie/stringtie
input:
  - ch_input:
      type: object
      description: BAM alignments with experiment, condition, strandedness, and reference annotation metadata
output:
  - data:
      type: file
      description: Assembled transcript GTF files with experiment and condition metadata
  - versions:
      type: file
      description: Version of StringTie used by the subworkflow
authors:
  - "@andre-marcos-perez"
maintainers:
  - "@andre-marcos-perez"
